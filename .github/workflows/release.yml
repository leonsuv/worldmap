name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: worldmap-linux-x64
            binary: worldmap-backend
          - os: macos-latest
            artifact: worldmap-macos-arm64
            binary: worldmap-backend
          - os: windows-latest
            artifact: worldmap-windows-x64
            binary: worldmap-backend.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build backend
        working-directory: backend
        run: cargo build --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Layout: binary, frontend-dist/, scripts/, .env.example — the server finds
      # frontend-dist/ and data/ next to itself.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          dir=release/${{ matrix.artifact }}
          mkdir -p "$dir"
          cp backend/target/release/${{ matrix.binary }} "$dir/"
          cp -r frontend/dist "$dir/frontend-dist"
          cp -r scripts "$dir/scripts"
          cp backend/.env.example "$dir/.env.example"
          cp README.md LICENSE "$dir/"
          tar -czf release/${{ matrix.artifact }}.tar.gz -C release ${{ matrix.artifact }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "release/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item backend/target/release/${{ matrix.binary }} $dir/
          Copy-Item -Recurse frontend/dist "$dir/frontend-dist"
          Copy-Item -Recurse scripts "$dir/scripts"
          Copy-Item backend/.env.example "$dir/.env.example"
          Copy-Item README.md, LICENSE $dir/
          Compress-Archive -Path $dir -DestinationPath "release/${{ matrix.artifact }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}.*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
