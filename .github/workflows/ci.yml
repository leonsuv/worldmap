name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

  scripts:
    name: Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m py_compile scripts/*.py
      - run: python scripts/ingest.py --help && python scripts/build_tiles.py --help

  smoke:
    name: End-to-end smoke test
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Build backend
        run: cargo build --manifest-path backend/Cargo.toml
      - name: Build sample tiles with the native tile builder
        run: |
          mkdir -p data/sources data/tiles
          printf '%s\n' \
            '{"type":"Feature","geometry":{"type":"LineString","coordinates":[[13.4,52.5],[11.6,48.1]]},"properties":{"voltage_kv":380,"kind":"line"}}' \
            > data/sources/sample.geojsonl
          backend/target/debug/worldmap-backend tiles build -o data/tiles/hv-lines.mbtiles -i data/sources/sample.geojsonl -l hvlines -Z 2 -z 8
          backend/target/debug/worldmap-backend tiles inspect data/tiles/hv-lines.mbtiles
      - name: Run server and smoke test
        run: |
          backend/target/debug/worldmap-backend > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/status > /dev/null && break; sleep 1; done
          python scripts/smoke_test.py --write
          curl -sf http://127.0.0.1:3000/ | grep -q '<div id="root">'
      - name: Server log
        if: always()
        run: cat server.log || true
