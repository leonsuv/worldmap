[package]
name = "worldmap-backend"
version = "0.2.0"
edition = "2021"
description = "WorldMap API server, live-feed fan-out and vector tile builder"
license = "MIT"
default-run = "worldmap-backend"

[lib]
name = "worldmap"
path = "src/lib.rs"

[[bin]]
name = "worldmap-backend"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dashmap = "6"
dotenvy = "0.15"
flate2 = "1"
futures-util = "0.3"
rayon = "1"
reqwest = { version = "0.12", features = ["json", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 4
